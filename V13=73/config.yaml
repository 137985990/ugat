data_dir: Data
data_files:
  - ../Data/FM_original.csv
  - ../Data/OD_original.csv
  - ../Data/MEFAR_original.csv
block_col: block
label_col: F  # 使用原始的大写F列

# 标签配平配置
label_balancing:
  enabled: true                # 是否启用标签配平
  target_datasets: ["FM"]      # 需要配平的数据集列表
  strategy: "undersample"      # 配平策略: undersample, oversample, smote
  target_ratio: null           # 目标比例，null表示完全平衡
  random_seed: 42              # 配平时的随机种子

## 指定本次训练/推理用的模态（FM、OD、MEFAR三者的去重并集，顺序可自定义）
common_modalities:
  - acc_x
  - acc_y
  - acc_z
  - ppg
  - gsr
  - hr
  - skt
dataset_modalities:
  FM:
    have:
      - alpha_tp9
      - alpha_af7
      - alpha_af8
      - alpha_tp10
      - beta_tp9
      - beta_af7
      - beta_af8
      - beta_tp10
      - delta_tp9
      - delta_af7
      - delta_af8
      - delta_tp10
      - gamma_tp9
      - gamma_af7
      - gamma_af8
      - gamma_tp10
      - theta_tp9
      - theta_af7
      - theta_af8
      - theta_tp10
      - ecg
      - breathing
    need:
      - space_distance
      - distance_to_eye_center
      - pose_pca
  OD:
    have:
      - space_distance
      - distance_to_eye_center
      - pose_pca
    need:
      - alpha_tp9
      - alpha_af7
      - alpha_af8
      - alpha_tp10
      - beta_tp9
      - beta_af7
      - beta_af8
      - beta_tp10
      - delta_tp9
      - delta_af7
      - delta_af8
      - delta_tp10
      - gamma_tp9
      - gamma_af7
      - gamma_af8
      - gamma_tp10
      - theta_tp9
      - theta_af7
      - theta_af8
      - theta_tp10
      - ecg
      - breathing
  MEFAR:
    have: []
    need:
      - alpha_tp9
      - alpha_af7
      - alpha_af8
      - alpha_tp10
      - beta_tp9
      - beta_af7
      - beta_af8
      - beta_tp10
      - delta_tp9
      - delta_af7
      - delta_af8
      - delta_tp10
      - gamma_tp9
      - gamma_af7
      - gamma_af8
      - gamma_tp10
      - theta_tp9
      - theta_af7
      - theta_af8
      - theta_tp10
      - ecg
      - breathing
      - space_distance
      - distance_to_eye_center
      - pose_pca
sample_rate: 32
window_sec: 10.0
step_sec: 3.0
window_size: 320  # 32*10.0
step_size: 96     # 32*3.0
norm_method: zscore
train_split: 0.6
# 针对32GB内存+16GB显存的配置（最大化显存利用）
batch_size: 32                  # 大幅增加batch size，充分利用16GB显存
epochs: 2000
lr: 0.0005                        # 相应调整学习率
patience: 30
accumulate_grad_batches: 1       # 减少梯度累积，直接使用大batch

# 高性能优化配置 - 最大化显存利用版本
use_optimized_model: true        
use_memory_optimizer: true       
use_gradient_checkpoint: true    # 梯度检查点节省显存
use_mixed_precision: true        # 混合精度训练节省显存
gradient_checkpointing: true     
num_workers: 0                   # Windows兼容
pin_memory: true                 
prefetch_factor: 8               # 增加预取因子
persistent_workers: false        

# 显存最大化调优
torch_compile: true              
dataloader_drop_last: true       
enable_fast_data_loading: false   # 暂时禁用，使用标准数据加载器
max_gpu_memory_fraction: 0.95    # 使用95%的显存

# 高级功能配置
use_unet_architecture: true    # 使用真正的U-Net架构
enable_attention_viz: false     # 启用注意力可视化

# 训练策略配置
training_strategy: "no_mask"  # 可选: "no_mask" (输入完整C+N+H) 或 "mask_have" (遮掩Have通道)
# no_mask: 输入完整C+N+H，只对C+H计算损失，只更新Need
# mask_have: 遮掩所有Have通道，用C+N重建Have，符合实际问题场景

encoder_layers: 3               # 减少编码器层数
decoder_layers: 3               # 减少解码器层数
transformer_layers: 1           # 减少Transformer层数
attention_heads: 4              # 修正：确保 hidden_channels (64) 能被 heads (4) 整除
time_k: 1                       # 时间邻接范围

log_dir: Logs
ckpt_dir: Checkpoints
in_channels: 32  # 与配置中定义的特征数量一致
hidden_channels: 64
out_channels: 32
num_classes: 2

mode: train  # 可选: train 或 eval，train=训练，eval=只加载模型推理/补全
model_path: Checkpoints/best_model.pth  # eval模式下加载的模型路径

# 损失函数配置
loss_config:
  type: "multimodal"           # 损失函数类型: basic, multimodal
  recon_weight: 1.0            # 重建损失权重 (α)
  cls_weight: 3.0              # 分类损失权重
  cls_improvement_weight: 2.0  # 分类改进损失权重 (β)
  base_classification_weight: 1.0  # 基础分类监督损失权重（新增）
  
  # 优化后的准确率奖励机制
  accuracy_reward_scale: 0.5   # 准确率奖励系数（降低以增加稳定性）
  accuracy_threshold: 0.02     # 准确率提升阈值（降低以提高敏感度）
  min_improvement_margin: 0.01 # 最小改进margin（降低初始要求）
  
  # 动态权重调整
  dynamic_weighting: true      # 是否启用动态权重调整
  weight_smoothing: true       # 是否使用权重平滑（新增）
  
  # 渐进式训练配置
  progressive_margin: true     # 是否启用渐进式margin（新增）
  margin_growth_rate: 0.1      # margin增长率（新增）
  
  # 损失稳定性配置
  gradient_clipping: true      # 是否启用梯度裁剪
  loss_smoothing: true         # 是否启用损失平滑（新增）
  smoothing_factor: 0.9        # 平滑因子（新增）
  
  # 分类训练强化配置（新增）
  classification_supervision: true  # 是否启用分类监督训练
  balanced_loss_strategy: true      # 是否使用平衡损失策略
  
  # 循环渐进训练策略说明：
  # 路径1: 输入数据分类 (Common真实 + Have真实 + Need初始值/上轮生成) → 基准性能
  # 路径2: 重建数据分类 (Common真实 + Have真实 + Need当前生成) → 目标性能
  # 目标: 每轮训练都让路径2的分类效果比路径1更好，实现循序渐进的Need通道补全
  
  common_weight: 1.0           # common_modalities权重（稍高，因为是真实数据）
  have_weight: 1.0             # have_modalities权重
  l1_weight: 0.1               # L1正则化权重
  adaptive: false              # 是否使用自适应权重调整
  
  # 详细损失监控
  log_detailed_losses: true    # 是否记录详细损失信息
  save_loss_curves: true       # 是否保存损失曲线图

# 增强验证配置
enhanced_validation:
  enabled: true                # 启用增强验证策略
  min_delta: 1e-6             # 最小改进阈值
  val_freq_schedule:          # 验证频率调度
    - epochs: [0, 10]
      frequency: 1            # 前10个epoch每次都验证
    - epochs: [10, 50]
      frequency: 2            # 10-50epoch每2次验证一次
    - epochs: [50, 999]
      frequency: 3            # 50+epoch每5次验证一次
  overfitting_threshold: 0.15 # 过拟合检测阈值
  composite_weights:          # 综合评分权重
    loss_weight: 0.2          # 损失权重
    accuracy_weight: 0.8      # 准确率权重

# 分阶段训练配置
staged_training:
  enabled: false               # 是否启用分阶段训练
  reconstruction_epochs: 50    # 阶段1：重建训练epoch数
  reconstruction_lr: 0.001     # 阶段1：重建训练学习率
  classification_epochs: 30    # 阶段2：分类训练epoch数
  classification_lr: 0.0005    # 阶段2：分类训练学习率
  joint_epochs: 20             # 阶段3：联合训练epoch数
  joint_lr: 0.0002             # 阶段3：联合训练学习率
  gradient_clipping: true      # 是否使用梯度裁剪
  
  # 阶段间模型加载策略
  load_best_reconstruction: true  # 阶段2是否加载阶段1的最佳模型
  load_best_classification: true  # 阶段3是否加载阶段2的最佳模型
